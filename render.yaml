# One-click deploy of the download resolver in `resolver/`.
#
# Render is the recommended hosting path for one reason: `generateValue` below means the access
# token is created for you, stays the same across restarts, and never has to be typed or even
# looked at — the resolver's own setup page hands it to the app. Everything here is the default
# except the things that must not be.
#
# Render looks for this file in the repository root, which is why it lives here rather than
# beside the Dockerfile it builds.
services:
  - type: web
    name: betteryoutube-resolver
    runtime: docker
    # Repository-root-relative, deliberately: mixing these with `rootDir` makes the base of each
    # path a guess, and a wrong guess here is a build that fails for no visible reason.
    dockerfilePath: ./resolver/Dockerfile
    dockerContext: ./resolver
    region: frankfurt
    healthCheckPath: /health
    # Without this Render bills the default 0.5c-512mb, which is $7/month. Free spins the service
    # down after 15 minutes idle and takes about a minute to wake — which costs a downloaded
    # video nothing but a slow start, since the app's transfer is in the background anyway.
    plan: free
    envVars:
      # Generated once, kept across restarts, and never shown to you — the setup page passes it
      # to the app. Without this the resolver would be open to anyone who found its address.
      - key: RESOLVER_TOKEN
        generateValue: true
      - key: MAX_HEIGHT
        value: "1080"
      # 1 lets the resolver join video and audio for anything above ~360p, which costs it
      # bandwidth. 0 keeps it free to run and caps quality at whatever YouTube already joins.
      - key: ALLOW_MUX
        value: "1"
